name: Publish verified v0.9.1 mistake-practice update

on:
  push:
    paths:
      - '.github/staged-release/v0.9.1-dev/**'
      - '.github/scripts/bootstrap_publish_v091.sh'
      - '.github/workflows/publish-v091-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install APK signature verifier
        run: sdkmanager 'build-tools;35.0.0'
      - name: Verify signed APK and publish update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/bootstrap_publish_v091.sh

